name: Check CRAN status

on:
  schedule:
    # Runs daily at 4:00 PM UTC (9:00 AM PST)
    - cron: '0 8 * * *'
  # allows for manually running of the check
  workflow_dispatch:

jobs:
  check_cran_status:
    runs-on: ubuntu-latest

    steps:
      - name: Get CRAN checks
        uses: ricochet-rs/cran-checks/check-pkg@7c785ec5542611c7843b7edcb50da28de4083d4b # main
        with:
          pkg: camtrapdp
